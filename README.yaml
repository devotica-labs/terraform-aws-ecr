description: |-
  Terraform module for one or more **Amazon ECR** private container repositories
  — the image registry ECS Fargate and EKS pull from. Fintech-safe defaults:
  IMMUTABLE tags, scan-on-push, KMS encryption, `force_delete` off, and a
  batteries-included lifecycle policy (untagged expiry + image-count cap with
  protected release tags). Optional cross-account read/write repository policy.

introduction: |-
  This module creates one [Amazon ECR](https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html)
  repository per name (defaulting to the composed label id), each with immutable
  tags, scan-on-push, KMS encryption, and a self-pruning lifecycle policy. A
  repository access policy is attached only when `read_principals` /
  `write_principals` (or `additional_policy_statements`) are supplied, letting a
  workload account pull while a CI/CD role pushes.

usage: |-
  See [`examples/basic`](examples/basic) for a single repository on defaults and
  [`examples/complete`](examples/complete) for a multi-repo registry with a
  customer-managed key, tuned retention, and cross-account access.

